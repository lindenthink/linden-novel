name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# GITHUB_TOKEN 需要写权限，tauri-action 才能创建 Release 并上传 assets
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - run: yarn install --frozen-lockfile

      - name: Build release notes from commits
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          # 取倒数第二个 tag（当前 tag 是最新的，倒数第二个就是上一个发布点）
          PREV_TAG=$(git tag --sort=-creatordate | sed -n '2p')
          {
            echo "RELEASE_BODY<<EOF"
            echo "## 更新内容"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "自 \`${PREV_TAG}\` 以来的改动："
              echo ""
              git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges
            else
              echo "本次首发的改动："
              echo ""
              git log --pretty=format:"- %s" --no-merges -n 30
            fi
            echo ""
            echo ""
            echo "---"
            echo "安装包与 \`latest.json\` 见下方 assets。"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "菩提思 ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
